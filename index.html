<!DOCTYPE html>
<html lang="en">
<head>
  <head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>n8n Form</title>
		<meta name="description" content="Basic HTML5 boilerplate for n8n_form project">

            <!-- google fonts -->
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <!-- bootstrap css -->
        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
	</head>
  <title>Lead Form</title>

  <style>
   
  </style>
</head>

<body style="background-color: #ED9153;" >

  <div class="form-container">
    <h2>Get in Touch</h2>

    <form action="https://churchl.app.n8n.cloud/webhook-test/lead-intake" method="POST">

      <div class="form-group">
        
                <div class="form-item">
                    Full Name*
                    <input type="text" name="name" placeholder="Full Name" required />
                </div>
                <div class="form-item">
                    Company Name*
                    <input type="text" name="COmpany" placeholder="Company name" required />
                </div>

                <div class="form-item">
                    Position/Role*
                    <input type="text" name="Position" placeholder="Position" required />
                </div>

                <div class="form-item">
                    Email*
                    <input type="email" name="email" placeholder="Email Address" required />
                </div>
                
                <div class="form-item">
                    Phone*
                    <input type="text" name="phone" placeholder="Phone Number" />
                </div>
                <div class="textarea-item">
                    <p><strong>Inquiry</strong></p>

                    <textarea style="" name="inquiry" placeholder="Type your message here..." rows="4" required></textarea>
                </div>

                


                    <button type="submit">Submit</button>
        </div>
    </form>
 

</body>
</html>
